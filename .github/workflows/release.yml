name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: ./scripts/package-release.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
      - name: Update Homebrew tap
        if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm_sha=$(cut -d ' ' -f 1 "dist/kalendar-v${version}-aarch64-apple-darwin.tar.gz.sha256")
          x86_sha=$(cut -d ' ' -f 1 "dist/kalendar-v${version}-x86_64-apple-darwin.tar.gz.sha256")
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          mkdir -p tap/Formula
          ./scripts/update-homebrew-formula.sh "$version" "$GITHUB_REPOSITORY" "$arm_sha" "$x86_sha" tap/Formula/kalendar.rb
          cd tap
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/kalendar.rb
          git commit -m "Update kalendar to ${version}"
          git push
